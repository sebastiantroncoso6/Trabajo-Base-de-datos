<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demoliciones y Obras Groudon - Inicio de Sesión</title>
    <link rel="stylesheet" href="css/usu.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script> <!-- cargamos el alpine.js, que es el formato para tener una pagina web interactiva-->
</head>
<body x-data="loginApp()"> <!--Damos a entender que alpine.js debe trabajar bajo las reglas del script, osea lo de mas abajo-->

    <header>
        <h1>Demoliciones y Obras Groudon</h1> <!-- titulo de la pagina-->
        <nav>
    <a href="paginas/trabajadores.html">Trabajadores</a>
    <a href="paginas/maquinaria.html">Maquinaria</a>
    <a href="paginas/finanzas.html">Finanzas</a>
</nav>
    </header>

    <main style="max-width: 400px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2>Iniciar Sesión</h2>
        <p>Ingrese sus credenciales de acceso al sistema:</p>

        <template x-if="mensajeError">
            <div style="background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border-radius: 5px;" x-text="mensajeError"></div>
        </template> <!-- esta linea es solo de decoracion, si no se rellenan las casillas entonces salta el error que no se puede ingresar-->

        <form @submit.prevent="validarLogin"> <!-- con esto evitamos que se recargue la pagina al enviar el formulario, usando javascript como funcion-->
            <div style="margin-bottom: 1rem;">
                <label for="correo" style="display: block; margin-bottom: 0.3rem; font-size: 0.85rem;">Correo Electrónico</label>
                <input type="email" id="correo" x-model="correo" placeholder="usuario@groudon.com" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label for="clave" style="display: block; margin-bottom: 0.3rem; font-size: 0.85rem;">Contraseña</label>
                <input type="password" id="clave" x-model="clave" placeholder="********" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px;">
            </div>

            <button type="submit" style="width: 100%; background-color: #1c3d5a; color: white; padding: 0.7rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">Ingresar al Sistema</button>
        </form> <!-- importante tomar en cuenta que los x-model son las partes donde escribe el usuario y genera una respuesta en milisegundos, importante esa wea sino todo se va a la mierda-->

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    </main>

    <script>
        function loginApp() {
            return {
                correo: '',
                clave: '',
                mensajeError: '',
                validarLogin() {
                    if (!this.correo || !this.clave) {
                        this.mensajeError = 'Por favor, complete todos los campos obligatorios.';
                        return;
                    }

                    // Lógica simulada de redirección según el rol en el correo
                    if (this.correo.includes('finanzas') || this.correo.includes('pago')) {
    alert('¡Inicio de sesión exitoso! Redirigiendo a Finanzas...');
    window.location.href = 'paginas/finanzas.html';
} else if (this.correo.includes('maquinaria') || this.correo.includes('operaciones')) {
    alert('¡Inicio de sesión exitoso! Redirigiendo a Maquinaria...');
    window.location.href = 'paginas/maquinaria.html';
} else {
    alert('¡Inicio de sesión exitoso! Redirigiendo a Trabajadores...');
    window.location.href = 'paginas/trabajadores.html';
}
                }
            }
        }
    </script>
</body>
</html>
